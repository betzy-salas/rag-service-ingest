spring.application.name=confluence-ingestion-service
server.port=8082

# Configuration and secrets come from Consul, reusing the keys under config/assistant/.
spring.config.import=consul:
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.config.name=assistant

management.endpoint.health.show-details=always
# Prometheus (docker compose of the project) scrapes /actuator/prometheus; metrics helps to inspect a value by hand.
management.endpoints.web.exposure.include=health,metrics,prometheus

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Liquibase owns the schema; Hibernate only validates that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
