# Tests run without Consul; the database is provided by Testcontainers.
spring.application.name=confluence-ingestion-service
spring.cloud.consul.enabled=false
spring.cloud.consul.config.enabled=false

app.confluence.base-url=http://localhost:65535
app.confluence.email=test@example.com
app.confluence.api-token=test-token

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.ai.openai.api-key=test-api-key
spring.ai.model.embedding=none
spring.ai.vectorstore.pgvector.table-name=confluence_chunk
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=NONE

# Liquibase owns the schema; Hibernate only validates that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
